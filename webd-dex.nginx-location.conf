# Adaugă acest bloc în configurația nginx existentă pentru webdollar.cloudns.nz
# (în interiorul blocului server {} existent, pe VPS-ul explorer — vezi
# /etc/nginx/sites-enabled/webd-explorer-https, root server-ului e deja
# /var/www/webd-explorer-8088/dist; /var/www/webd-dex trebuie să fie, sau să
# devină, un symlink către un subdirector "dex" din acel dist, la fel cum
# /var/www/tracker e symlink din dist/tracker)
#
# NU folosi `alias` aici cu acest try_files — combinația `alias` +
# `try_files $uri $uri/ /dex/index.html;` produce un ciclu de redirecționare
# internă la nginx (testat 2026-11-09, eroare "rewrite or internal
# redirection cycle"). Varianta cu `root`, ca mai jos, e cea care merge,
# la fel ca blocul deja existent pentru /tracker/.

    location /dex/ {
        root /var/www/webd-explorer-8088/dist;
        index index.html;
        try_files $uri $uri/ /dex/index.html;
    }
